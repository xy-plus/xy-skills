<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仓库功能图</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;--paper:#f5f7fb;--card:#fff;--ink:#263247;--muted:#65728a;--line:#cbd5e1;--accent:#376cc8;--draft:#9b5b13}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
#bar{height:56px;display:flex;align-items:center;gap:9px;padding:0 16px;background:#ffffffed;border-bottom:1px solid var(--line);box-shadow:0 1px 4px #24314a12;white-space:nowrap;overflow:hidden;position:relative;z-index:2}
#brand{font-size:15px;font-weight:700;margin-right:6px}
#draft{font-size:13px;font-weight:700;color:var(--draft)}
#crumbs{display:flex;align-items:center;gap:5px;flex:1;min-width:0;overflow-x:auto;font-size:13px;scrollbar-width:none}
#crumbs::-webkit-scrollbar{display:none}
#crumbs button{border:0;padding:3px 4px;background:transparent;color:var(--accent);font:inherit;cursor:pointer}
#crumbs button:last-child{color:var(--ink);font-weight:700;cursor:default}
.separator{color:#9aa6b8}
.spacer{flex:1}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-height:40px;cursor:pointer}
button:hover{background:#f1f5fb}
#mode{font-weight:650;min-width:92px}
#relations{min-width:92px}
#stage{position:absolute;inset:56px 0 0}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
.edge{fill:none;stroke:#7b8da8;stroke-width:1.65;vector-effect:non-scaling-stroke}
.edge-label-bg{fill:#fff;stroke:#d6deea;stroke-width:1;vector-effect:non-scaling-stroke}
.edge-label{fill:#4d5b72;font-size:14px;text-anchor:middle;dominant-baseline:middle}
.composition-spine,.composition-edge{fill:none;stroke:#98a2b1;stroke-width:1.7;vector-effect:non-scaling-stroke}
.relation-edge{fill:none;stroke:#b64e83;stroke-width:1.8;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;marker-end:url(#relation-arrow)}
.relation-edge.highlighted{stroke:#a62968;stroke-width:2.7;opacity:1}
.relation-edge.dimmed,.relation-label.dimmed{opacity:.13}
.relation-label-bg{fill:#fff;stroke:#e5bfd1;stroke-width:1;vector-effect:non-scaling-stroke}
.relation-label{fill:#813454;font-size:13px;text-anchor:middle;dominant-baseline:middle}
.relation-label.highlighted{stroke:#f4d9e6;stroke-width:3px;paint-order:stroke}
.relation-label.dimmed{opacity:.18}
.card{filter:drop-shadow(0 2px 4px #24314a18)}
.card-shape{stroke-width:1.4;vector-effect:non-scaling-stroke}
.card-title{fill:#263247}
.title-depth-0{font-size:17px;font-weight:700}.title-depth-1{font-size:16px;font-weight:700}
.title-depth-2{font-size:15px;font-weight:600}
.metric-box{fill:#f3f6fb;stroke:#e0e6ef;stroke-width:1;vector-effect:non-scaling-stroke}
.metric-text{font-size:15px;font-weight:600;fill:#45546d}.description{font-size:13px;fill:#59677e}
.coverage{font-size:12px;fill:#77849a}.repo-badge{fill:#fff4db;stroke:#ead8aa;stroke-width:1;vector-effect:non-scaling-stroke}
.repo-badge-text{font-size:10px;font-weight:700;fill:#85621d}
.clickable{cursor:pointer}
.clickable:hover .card-shape{stroke-width:2.5}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:7px}
.zoom button{width:42px;height:42px;padding:0;font-size:20px;box-shadow:0 2px 8px #24314a20}
@media(max-width:680px){
  #bar{gap:4px;padding:0 6px}
  #brand{display:none}
  #draft{font-size:11px;flex:none}
  #crumbs{gap:3px}
  .spacer{display:none}
  #mode,#fit,#relations{flex:none;min-width:44px;padding:0 5px;font-size:12px}
  #mode{max-width:60px}
  #fit{min-width:44px}
  #relations{min-width:72px}
  #crumbs button{min-height:40px;padding:0 4px}
  .zoom{right:8px;bottom:8px}
}
</style>
<script src="elk.bundled.js"></script>
</head>
<body>
<header id="bar">
  <span id="brand">仓库功能图</span>
  <strong id="draft">__MODE_STATUS__</strong>
  <nav id="crumbs" aria-label="图层路径"></nav>
  <span class="spacer"></span>
  <button id="mode" type="button">钻入</button>
  <button id="fit" type="button">适配</button>
  <button id="relations" type="button" aria-pressed="true">隐藏关系</button>
</header>
<main id="stage">
  <svg id="map" role="img" aria-label="仓库功能关系图"></svg>
  <div class="zoom" aria-label="缩放控制">
    <button id="zoom-in" type="button" aria-label="放大">＋</button>
    <button id="zoom-out" type="button" aria-label="缩小">－</button>
  </div>
</main>
<script id="page-data" type="application/json">__PAGE_DATA_JSON__</script>
<script src="map-page.js" defer></script>
</body>
</html>
